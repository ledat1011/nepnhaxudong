  <!-- Ba leans toward the furnace (turned about his feet), so the poker ends inside the fire door. -->
  <g transform="translate(-16 8) rotate(-14 330 556)"><g transform="translate(408 0) scale(-1 1)">
    <use data-person="ba-canh-lo" data-slot="father" x="0" y="350" width="206" height="206"/>
  </g></g>
  <!-- hot air: fan, furnace, plenum, then up through the mesh and the paddy -->
  <g>
    <g data-part="air" transform="translate(108 330)">
      <path d="M0 0H44" fill="none" stroke="#4A2C1A" stroke-width="10" stroke-linecap="round"/>
      <path d="M0 0H44" fill="none" stroke="#CFE4EE" stroke-width="5" stroke-linecap="round"/>
      <path d="M42 -11L60 0L42 11Z" fill="#CFE4EE" stroke="#4A2C1A" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <use data-part="air" href="#rt" transform="translate(222 491)"/>
    <use data-part="air" href="#rt" transform="translate(354 470)"/>
    <use data-part="air" href="#rt" transform="translate(500 470)"/>
    <use data-part="air" href="#rt" transform="translate(646 470)"/>
    <use data-part="air" href="#up" transform="translate(420 444)"/>
    <use data-part="air" href="#up" transform="translate(560 444)"/>
    <use data-part="air" href="#up" transform="translate(700 444)"/>
    <use data-part="air" href="#up" transform="translate(480 344) scale(0.8)"/>
    <use data-part="air" href="#up" transform="translate(620 344) scale(0.8)"/>
