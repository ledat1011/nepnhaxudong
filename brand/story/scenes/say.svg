<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Scene 4, drying the paddy at home, after the owner's sketch: a fan on a stand blows through a charcoal furnace,
       the hot air goes into the plenum under a long chamber and rises through the steel mesh and the paddy layer.
       The chamber is drawn cut open at the front. Father stands by the furnace. -->
