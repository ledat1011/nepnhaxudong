      <g fill="#8B5A2B" fill-opacity="0.45">
        <ellipse cx="3" cy="2.5" rx="2.6" ry="1.5" transform="rotate(-25 3 2.5)"/>
        <ellipse cx="10" cy="3.5" rx="2.6" ry="1.5" transform="rotate(40 10 3.5)"/>
        <ellipse cx="6" cy="8" rx="2.6" ry="1.5" transform="rotate(10 6 8)"/>
      </g>
    </pattern>
    <g id="up">
      <path d="M0 0q-8 -12 0 -24t0 -24V-60" fill="none" stroke="#4A2C1A" stroke-width="10" stroke-linecap="round"/>
