      <path d="M42 -11L60 0L42 11Z" fill="#E59A84" stroke="#4A2C1A" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="#CFE4EE"/>
  <rect y="230" width="800" height="70" fill="#E9F2F1"/>
  <path d="M0 302V286q14 -16 28 0q17 -10 34 0q20 -18 40 0q14 -12 28 0q17 -8 34 0q20 -16 40 0q14 -10 28 0q17 -14 34 0q20 -18 40 0q14 -10 28 0q17 -12 34 0q20 -16 40 0q14 -8 28 0q17 -14 34 0q20 -10 40 0q14 -18 28 0q17 -14 34 0q20 -10 40 0q14 -16 28 0q17 -12 34 0q20 -8 40 0q14 -14 28 0q17 -18 34 0q20 -10 40 0V302Z" fill="#6E8B3D" fill-opacity="0.45"/>
  <rect y="300" width="800" height="260" fill="#F2E2B6"/>
