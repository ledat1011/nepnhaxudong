    <path d="M330 360H762V408H330Z" fill="url(#pd)" stroke="none"/>
    <path d="M330 360Q360 352 390 360T450 360T510 360T570 360T630 360T690 360T762 358" fill="none" stroke-width="3.5"/>
    <g fill="#D9A13B" stroke-width="2">
    <ellipse cx="340" cy="372" rx="4" ry="6.5" transform="rotate(60 340 372)"/>
    <ellipse cx="452" cy="384" rx="4" ry="6.5" transform="rotate(20 452 384)"/>
    <ellipse cx="540" cy="372" rx="4" ry="6.5" transform="rotate(-40 540 372)"/>
    <ellipse cx="664" cy="386" rx="4" ry="6.5" transform="rotate(70 664 386)"/>
    <ellipse cx="740" cy="374" rx="4" ry="6.5" transform="rotate(-20 740 374)"/>
