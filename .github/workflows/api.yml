name: api

on:
  push:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: cd api && ./mvnw -B verify
