name: fullstack

on:
  pull_request:
    paths:
      - 'api/**'
      - 'web/**'
      - '.github/workflows/fullstack.yml'

permissions:
  contents: read

concurrency:
  group: fullstack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Starts Postgres (Docker), the API jar and the web app, then runs the admin e2e tests.
      - run: npm run test:fullstack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
